<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangar Delta Uno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono&display=swap">
<style>
/* Hangar oscuro a propósito (es el mismo azul noche del juego): un solo tema. Lienzo 3D a pantalla completa y controles abajo. */
:root{
  color-scheme:dark;
  --bg:#0a1022;--panel:rgba(10,16,34,.86);--paper:#f6ead6;--dim:rgba(246,234,214,.68);--line:rgba(246,234,214,.2);--ember:#ff6b3d;--ink:#1a0d06;
  --label:'B612',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--data:'B612 Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font:15px/1.45 var(--label);overflow:hidden}
#view{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;left:0;right:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;pointer-events:none}
header b{letter-spacing:.16em;text-transform:uppercase;font-size:15px}
header span{color:var(--dim);font-size:13px}
#hint{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));color:var(--dim);font:12px/1.4 var(--data);pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding-top:28px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px;background:linear-gradient(rgba(10,16,34,0),var(--panel) 34%)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.row small{color:var(--dim);font:11px/1 var(--data);letter-spacing:.08em;text-transform:uppercase;min-width:64px}
button{font:inherit;font-size:14px;color:var(--paper);background:rgba(246,234,214,.06);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{background:rgba(246,234,214,.12)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--ink);font-weight:700}
#desc{margin:0;color:var(--dim);font-size:13.5px;max-width:56ch;min-width:0}
</style>
</head>
<body>
<canvas id="view"></canvas>
<header><b>Delta Uno</b><span>Hangar · diseños de la nave</span></header>
<div id="hint">Arrastrá para girarla · pellizcá o usá la rueda para acercar</div>
<div id="ui">
  <p id="desc"></p>
  <div class="row" id="models"><small>Diseño</small></div>
  <div class="row" id="palettes"><small>Colores</small></div>
  <div class="row" id="views"><small>Vista</small></div>
</div>
<script type="module" src="./hangar.js"></script>
</body>
</html>
