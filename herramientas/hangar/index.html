<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangar Delta Uno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono&display=swap">
<style>
/* Hangar oscuro a propósito (es el mismo azul noche del juego): un solo tema. Lienzo 3D a pantalla completa,
   datos de la nave arriba a la derecha y controles abajo, en pestañas para que entren en un teléfono acostado. */
:root{
  color-scheme:dark;
  --bg:#0a1022;--panel:rgba(10,16,34,.86);--paper:#f6ead6;--dim:rgba(246,234,214,.68);--line:rgba(246,234,214,.2);--ember:#ff6b3d;--ink:#1a0d06;
  --label:'B612',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--data:'B612 Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font:15px/1.45 var(--label);overflow:hidden}
#view{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;left:0;right:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;pointer-events:none}
header b{letter-spacing:.16em;text-transform:uppercase;font-size:15px}
header span{color:var(--dim);font-size:13px}
#hint{position:fixed;top:calc(40px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));color:var(--dim);font:12px/1.4 var(--data);pointer-events:none;max-width:46ch}
#info{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:12px/1.5 var(--data);min-width:200px;pointer-events:none}
#info b{font:700 14px/1.3 var(--label);display:block}
#info .k{color:var(--dim)}
#ui{position:fixed;left:0;right:0;bottom:0;padding-top:24px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:8px;background:linear-gradient(rgba(10,16,34,0),var(--panel) 30%)}
.tabs{display:flex;gap:6px}
.tabs button{border-radius:4px 4px 0 0}
.panel{display:grid;gap:8px}
.panel[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.row small{color:var(--dim);font:11px/1 var(--data);letter-spacing:.08em;text-transform:uppercase;min-width:64px}
button{font:inherit;font-size:14px;color:var(--paper);background:rgba(246,234,214,.06);border:1px solid var(--line);border-radius:4px;padding:7px 11px;cursor:pointer;min-height:40px}
button:hover{background:rgba(246,234,214,.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button[aria-pressed="true"],button[aria-selected="true"]{background:var(--ember);border-color:var(--ember);color:var(--ink);font-weight:700}
.swatch{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.swatch span{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:block}
/* simulador de mandos: palanca con resorte, pedales, empuje y lo que la nave tenga */
.sim{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.palanca-box{display:grid;justify-items:center;gap:4px}
.palanca-box small{color:var(--dim);font:11px/1 var(--data);letter-spacing:.08em;text-transform:uppercase}
#palanca{width:120px;height:120px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(circle,rgba(246,234,214,.08) 0 2px,transparent 3px),repeating-linear-gradient(0deg,transparent 0 59px,var(--line) 59px 60px),repeating-linear-gradient(90deg,transparent 0 59px,var(--line) 59px 60px);display:grid;place-items:center;touch-action:none;cursor:grab}
#palanca-b{width:36px;height:36px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 4px rgba(255,107,61,.25);transition:transform .15s ease-out;pointer-events:none}
.ejes{display:grid;gap:6px;flex:1;min-width:180px}
.ejes label{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font:12px/1.2 var(--data);color:var(--dim)}
#lecturas{margin:0;font:12px/1.4 var(--data);color:var(--paper)}
input[type=range]{width:100%;accent-color:var(--ember);min-height:32px}
#desc{margin:0;color:var(--dim);font-size:13.5px;max-width:64ch;min-width:0}
.etq{position:fixed;transform:translate(-50%,0);font:12px/1.2 var(--data);color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 6px;pointer-events:none;white-space:nowrap}
@media (max-height:520px){button{min-height:36px;padding:5px 9px;font-size:13px}#hint{display:none}#info{font-size:11px;min-width:170px;padding:6px 8px}#desc{display:none}.row small{min-width:0}}
/* teléfono acostado: los controles van en una columna a la izquierda y la nave ocupa el resto */
@media (max-height:520px) and (orientation:landscape){
  #ui{top:0;right:auto;width:min(360px,44vw);align-content:start;overflow-y:auto;padding-top:calc(46px + env(safe-area-inset-top,0px));padding-right:12px;background:var(--panel);border-right:1px solid var(--line)}
  #palanca{width:104px;height:104px}
}
.swatch[data-v="ninguna"] span{border-style:dashed}
/* editor de efectos (pestaña Piezas): un bloque por pieza, con su botón para probarla y sus ajustes */
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.bloque{border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:6px;align-content:start}
.bloque h3{margin:0;font:700 12px/1.2 var(--data);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bloque h3 button{min-height:32px;padding:4px 9px;font:13px/1.2 var(--label);letter-spacing:0;text-transform:none}
.bloque label{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:6px;font:12px/1.2 var(--data);color:var(--dim)}
.bloque label output{color:var(--paper);text-align:right}
.bloque .row button{min-height:32px;padding:4px 9px;font-size:13px}
.nota{margin:0;color:var(--dim);font:12px/1.4 var(--data)}
@media (max-height:520px) and (orientation:landscape){.editor{grid-template-columns:1fr}.tabs button{padding:5px 7px}}
/* en Piezas los ajustes son largos: van en una columna al costado, así la nave queda a la vista */
body.columna #ui{top:0;right:auto;width:min(400px,42vw);align-content:start;overflow-y:auto;padding-top:calc(46px + env(safe-area-inset-top,0px));padding-right:12px;background:var(--panel);border-right:1px solid var(--line)}
body.columna .editor{grid-template-columns:1fr}
body.columna #hint,body.columna header{display:none}
@media (max-width:640px) and (orientation:portrait){body.columna #ui{top:auto;width:auto;right:0;max-height:55vh;border-right:0}}
</style>
</head>
<body>
<canvas id="view" aria-label="La nave en 3D"></canvas>
<header><b>Delta Uno</b><span>Hangar</span></header>
<div id="hint">Arrastrá para girarla · pellizcá o usá la rueda para acercar</div>
<div id="info" aria-live="polite"></div>
<div id="etiquetas"></div>
<div id="ui">
  <div class="tabs" role="tablist" aria-label="Controles">
    <button type="button" role="tab" id="tab-nave" aria-controls="p-nave" aria-selected="true">Nave</button>
    <button type="button" role="tab" id="tab-vuelo" aria-controls="p-vuelo" aria-selected="false">Vuelo</button>
    <button type="button" role="tab" id="tab-piezas" aria-controls="p-piezas" aria-selected="false">Piezas</button>
    <button type="button" role="tab" id="tab-vista" aria-controls="p-vista" aria-selected="false">Vista</button>
    <button type="button" role="tab" id="tab-graficos" aria-controls="p-graficos" aria-selected="false">Gráficos</button>
  </div>
  <div class="panel" id="p-nave" role="tabpanel" aria-labelledby="tab-nave">
    <p id="desc"></p>
    <div class="row" id="models"><small>Diseño</small></div>
  </div>
  <div class="panel" id="p-vuelo" role="tabpanel" aria-labelledby="tab-vuelo" hidden>
    <div class="sim">
      <div class="palanca-box">
        <div id="palanca" role="slider" tabindex="0" aria-label="Palanca: a los costados rota, adelante y atrás sube o baja la trompa. Flechas del teclado." aria-valuetext="centro"><span id="palanca-b"></span></div>
        <small>Palanca</small>
      </div>
      <div class="ejes">
        <label for="pedales"><span>Pedales</span><input type="range" id="pedales" min="-1" max="1" step="0.01" value="0"></label>
        <label for="empuje"><span>Empuje</span><input type="range" id="empuje" min="0" max="1" step="0.01" value="0.5"></label>
        <div class="row" id="toggles"></div>
        <p id="lecturas" aria-live="off"></p>
      </div>
    </div>
    <div class="row" id="maniobras"><small>Maniobra</small></div>
  </div>
  <div class="panel" id="p-piezas" role="tabpanel" aria-labelledby="tab-piezas" hidden>
    <div class="editor" id="editor"></div>
    <div class="row"><button type="button" id="copiarAjustes">Copiar ajustes</button><button type="button" id="restablecer">Restablecer</button><span id="copiado" class="nota" aria-live="polite"></span></div>
  </div>
  <div class="panel" id="p-vista" role="tabpanel" aria-labelledby="tab-vista" hidden>
    <div class="row" id="views"><small>Vista</small></div>
    <div class="row" id="palettes"><small>Skin</small></div>
  </div>
  <div class="panel" id="p-graficos" role="tabpanel" aria-labelledby="tab-graficos" hidden>
    <div class="row" id="lods"><small>Detalle</small></div>
    <div class="row" id="calidadFx"><small>Efectos</small></div>
    <p class="nota">Automático cambia el detalle según la distancia, como en el juego. Los efectos livianos usan la mitad del humo y el fuego.</p>
  </div>
</div>
<script type="module" src="./hangar.js"></script>
</body>
</html>
