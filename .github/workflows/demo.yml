# Arma la demo: el APK para Android y el juego para computadora (un HTML que se abre en el navegador).
# - Cada vez que se sube algo a main: arma los dos y los deja en Actions → la corrida → "Artifacts".
# - Con una etiqueta de versión (v0.12.0, v0.13.0…): además publica una versión en Releases, para compartir.
# - A mano (Actions → "Armar la demo" → Run workflow): arma y publica la versión de package.json en Releases.
#   Si esa versión ya estaba publicada, reemplaza los archivos (sirve después de cargar las variables de abajo).
# Los datos de PostHog y el enlace del formulario se cargan en Settings → Secrets and variables → Actions → Variables:
#   POSTHOG_KEY, POSTHOG_HOST (opcional) y FEEDBACK_URL. Sin ellos, la demo no manda datos ni muestra "Dar tu opinión".
name: Armar la demo

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Armar el juego
        run: npx vite build
        env:
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Pasar el juego al proyecto Android
        run: npx cap sync android

      - name: Armar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Juntar los archivos
        run: |
          V=$(node -p "require('./package.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir -p salida pc
          cp android/app/build/outputs/apk/release/app-release.apk "salida/delta-uno-$V.apk"
          cp dist/index.html "pc/Delta Uno.html"
          cp docs/version/LEEME-pc.txt pc/LEEME.txt
          (cd pc && zip -q -r "../salida/delta-uno-pc-$V.zip" .)
          sed "s/VERSION/$V/g" docs/version/notas.md > notas.md
          ls -la salida

      - name: Revisar el APK
        run: |
          APK="salida/delta-uno-$V.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|application-label:|launchable-activity" | tee badging.txt
          grep -q "versionName='$V'" badging.txt || { echo "::error::La versión del APK no es $V"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "screenOrientation" || { echo "::error::Falta la pantalla horizontal"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          unzip -l "$APK" | grep -q "assets/public/index.html" || { echo "::error::El APK no trae el juego"; exit 1; }
          unzip -p "$APK" assets/capacitor.config.json

      - uses: actions/upload-artifact@v6
        with:
          name: delta-uno-${{ env.V }}
          path: salida/

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$V"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" salida/* --clobber
          else
            gh release create "$TAG" salida/* --target "$GITHUB_SHA" --title "Delta Uno $V (demo)" --notes-file notas.md
          fi
